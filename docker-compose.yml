version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: darsi-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-darsi}
      POSTGRES_DB: ${POSTGRES_DB:-darsi}
    # Dibatasi ke 127.0.0.1 -- "Zero Open Inbound Ports" (ADR-027), pola sama
    # yang sebelumnya dipakai untuk service ollama. api tidak butuh port host
    # ini sama sekali (connect lewat network Docker internal "db:5432"); ini
    # cuma buat debug manual dari server itu sendiri (psql/SSH tunnel).
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./schema_rag.sql:/docker-entrypoint-initdb.d/02_schema_rag.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-darsi}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: darsi-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-darsi}@db:5432/${POSTGRES_DB:-darsi}
      POI_SYNC_TOKEN: ${POI_SYNC_TOKEN:-darsi-admin-token}
      # Bifrost = provider LLM UTAMA, gateway eksternal (hcm-lab.id) -- BUKAN
      # service di compose ini, jadi tidak butuh GPU di host ini. Groq FALLBACK,
      # dua-duanya boleh kosong secara individual tapi endpoint jadi rentan kalau
      # keduanya kosong/gagal bersamaan. Lihat generation.py.
      BIFROST_API_KEY: ${BIFROST_API_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      TTS_BASE_URL: ${TTS_BASE_URL:-}
      # Tier 2 TTS offline (ADR-033 Amandemen 033-C). Path ini dipastikan ada oleh
      # Dockerfile SAAT BUILD (bukan volume terpisah) -- lihat catatan lisensi di sana.
      # Lexicon dikosongkan sengaja: model Piper pakai frontend espeak-ng (data_dir),
      # bukan kamus lexicon terpisah.
      SHERPA_ONNX_VITS_MODEL: /app/models/vits-id/id_ID-news_tts-medium.onnx
      SHERPA_ONNX_VITS_TOKENS: /app/models/vits-id/tokens.txt
    # Port host default 8050 (ADR-027 Amandemen 027-B) agar tidak bertabrakan
    # dengan service backend lain di server host yang sama (misal DARSI-CS di port 8000).
    ports:
      - "${API_PORT:-8050}:8000"
    volumes:
      - fastembed_cache:/app/.fastembed_cache
      - tts_cache:/app/static/tts

volumes:
  pgdata:
  fastembed_cache:
  tts_cache:
