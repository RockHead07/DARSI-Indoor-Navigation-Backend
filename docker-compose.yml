version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: darsi-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-darsi}
      POSTGRES_DB: ${POSTGRES_DB:-darsi}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./schema_rag.sql:/docker-entrypoint-initdb.d/02_schema_rag.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-darsi}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Qwen lokal, primer untuk generation (lihat app/assistant/generation.py). Jalan
  # sebagai service di network Docker yang SAMA dengan api, bukan di host langsung --
  # itu sebabnya api bisa memanggilnya lewat "http://ollama:11434", bukan localhost
  # (localhost di dalam kontainer api adalah kontainer itu sendiri, bukan host).
  #
  # Port host cuma di-bind ke 127.0.0.1, TIDAK dipublikasikan ke jaringan/internet --
  # menjaga prinsip "Zero Open Inbound Ports" ADR-027. Dipakai buat debug manual dari
  # server itu sendiri (curl localhost:11434), bukan buat diakses dari luar.
  #
  # Model TIDAK otomatis tertarik saat container pertama nyala -- itu langkah manual
  # sekali jalan, lihat README bagian "Setup Qwen lokal (Ollama)".
  ollama:
    image: ollama/ollama:latest
    container_name: darsi-ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: darsi-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-darsi}@db:5432/${POSTGRES_DB:-darsi}
      POI_SYNC_TOKEN: ${POI_SYNC_TOKEN:-darsi-admin-token}
      # Groq sekarang FALLBACK, bukan wajib -- lihat generation.py. Kosong tetap
      # boleh, tapi endpoint asisten jadi rentan kalau Ollama juga gagal.
      GROQ_API_KEY: ${GROQ_API_KEY}
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - fastembed_cache:/app/.fastembed_cache

volumes:
  pgdata:
  fastembed_cache:
  ollama_data:
